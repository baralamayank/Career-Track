function fresh(){return {applications:[],interviews:[],contacts:[],reminders:[]}}
function load(){try{let d=JSON.parse(localStorage.getItem(KEY));if(d&&Array.isArray(d.applications)&&Array.isArray(d.interviews)&&Array.isArray(d.contacts)&&Array.isArray(d.reminders))return d}catch(e){}return fresh()}
let db=fresh(),activeUser=null,client=null,cloudReady=false,syncBusy=false,syncPending=false,saveTimer=null,authMode='login',authMessage='',page='dashboard',query='',filter='All',modal=null,editId=null;
const $=id=>document.getElementById(id),save=()=>{if(!cloudReady)return; syncPending=true;clearTimeout(saveTimer);saveTimer=setTimeout(flushSync,350)},esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),fmt=x=>x?new Date(x+'T12:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}):'—',id=()=>Math.random().toString(36).slice(2,12),today=()=>new Date().toLocaleDateString('en-CA'),appOf=x=>db.applications.find(a=>a.id===x),status=x=>`<span class="pill ${esc(x)}">${esc(x)}</span>`,item=(title,sub,ico='✦')=>`<div class="listrow"><div class="doticon">${ico}</div><div><strong>${title}</strong><p>${sub}</p></div></div>`;
const nav=[['dashboard','▦','Dashboard'],['applications','▤','Applications'],['interviews','▣','Interviews'],['contacts','♙','Contacts'],['reminders','◷','Reminders'],['analytics','◫','Analytics'],['settings','⚙','Data & Settings']];
function shell(){return `<div class="app"><aside class="sidebar"><div class="brand"><div class="brand-icon">↗</div><div>CareerTrack<small>YOUR JOB SEARCH, ORGANIZED</small></div></div><nav class="nav">${nav.map(([k,i,n])=>`<button data-page="${k}" class="${page===k?'active':''}"><span class="sym">${i}</span>${n}</button>`).join('')}</nav><div class="side-bottom"><strong>CareerTrack Pro Tips</strong><div>Keep your search organized, track progress, and stay ready for every follow-up.</div><button data-action="demo">Load sample data</button></div></aside><div class="main"><header class="topbar"><div class="mini">CareerTrack / ${nav.find(n=>n[0]===page)?.[2]}</div><div class="avatar"><span>CT</span>${esc(activeUser?.email||'Student workspace')} <button class="btn small" data-action="signout">Sign out</button></div></header><main class="content">${content()}<div class="footer">CareerTrack · Professional job-search workspace · Secure cloud storage</div></main></div></div>${modal?modalHTML():''}`}
function heading(t,d,btn,action){return `<div class="section-head"><div><h1>${t}</h1><p>${d}</p></div>${btn?`<button class="btn primary" data-action="${action}">+ ${btn}</button>`:''}</div>`}
function metric(t,v,sub,ico){return `<div class="metric"><div class="label">${t}<span class="badgeico">${ico}</span></div><div class="value">${v}</div><div class="sub">${sub}</div></div>`}
function content(){let a=db.applications,inter=a.filter(x=>x.status==='Interview').length,offer=a.filter(x=>x.status==='Offer').length,pending=db.reminders.filter(r=>!r.done).length;
if(page==='dashboard'){let recent=[...a].sort((x,y)=>(y.applied||'').localeCompare(x.applied||'')).slice(0,5),upcoming=[...db.interviews.map(i=>({date:i.date,title:`Interview: ${appOf(i.applicationId)?.company||'Unlinked'}`,sub:`${appOf(i.applicationId)?.role||''} · ${i.time||'Time not set'}`,icon:'▣'})),...db.reminders.filter(r=>!r.done).map(r=>({date:r.date,title:r.task,sub:appOf(r.applicationId)?.company||'General reminder',icon:'◷'}))].filter(x=>x.date>=today()).sort((x,y)=>x.date.localeCompare(y.date)).slice(0,5);return `${heading('Your job search, at a glance','Everything you need to stay on top of your applications.','Add application','add-app')}<div class="notice">Welcome to CareerTrack! Your records are stored securely in your private cloud workspace. Use <b>Data & Settings</b> to export a backup. ${a.length?'Sample data may be present if you loaded it.':''}</div><div class="metrics">${metric('Total applications',a.length,'Across all companies','▤')}${metric('Interview stage',inter,'Applications in interview','▣')}${metric('Offers received',offer,'Keep your momentum going','★')}${metric('Open reminders',pending,'Things to follow up on','◷')}</div><div class="two"><div><section class="panel"><div class="panelhead"><h2>Recent applications</h2><button class="linkbtn" data-page="applications">View all →</button></div>${recent.length?tableApps(recent,true):`<div class="empty">No applications yet. Add your first opportunity to get started.</div>`}</section><section class="panel"><div class="panelhead"><h2>Application pipeline</h2><span class="muted">Current statuses</span></div>${pipeline()}</section></div><section class="panel"><div class="panelhead"><h2>Upcoming activities</h2><button class="linkbtn" data-page="reminders">View reminders →</button></div>${upcoming.length?upcoming.map(e=>item(esc(e.title),`${fmt(e.date)} · ${esc(e.sub)}`,e.icon)).join(''):`<div class="empty">No upcoming events. Add interviews or reminders to see them here.</div>`}</section></div>`}

if(kind==='reminder')fields=sel('Application','applicationId',['',...db.applications.map(x=>x.id)],existing.applicationId||quickContext?.applicationId||'').replace(/>([^<>]*)<\/option>/g,(m,v)=>`>${v?esc((appOf(v)?.company||'')+' — '+(appOf(v)?.role||'')):'General reminder'}</option>`)+fld('Due date *','date',existing.date,'date','required')+`<label class="field full">Task *<input name="task" value="${esc(existing.task)}" required maxlength="180"></label>`;

function del(kind,k){if(!confirm('Delete this record? This action cannot be undone.'))return;let key={app:'applications',interview:'interviews',contact:'contacts',reminder:'reminders'}[kind];db[key]=db[key].filter(x=>x.id!==k);if(kind==='app'){db.interviews=db.interviews.filter(x=>x.applicationId!==k);db.reminders=db.reminders.filter(x=>x.applicationId!==k)}save();render()}
function autoFillJob(){
 const area=document.getElementById('job-paste'),form=document.getElementById('recordform');if(!area||!form)return;
 const raw=area.value.trim();if(!raw){alert('Paste a job posting or description first.');return}
 // LinkedIn copy/paste often includes Markdown links, logo alt text and tracking parameters.
 const links=[...raw.matchAll(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g)].map(m=>({label:m[1].replace(/\*+/g,'').trim(),url:m[2].replace(/\\&/g,'&')}));
 const jobLink=links.find(x=>/linkedin\.com\/jobs\/view\/\d+/i.test(x.url))||links.find(x=>/\/jobs?\/|\/careers?\//i.test(x.url));
 const companyLink=links.find(x=>/linkedin\.com\/company\//i.test(x.url)&&!/^company logo|^image$/i.test(x.label));
 let company=companyLink?.label||'',role=jobLink?.label||'';
 const visible=raw.replace(/!\[[^\]]*\]\([^)]*\)/g,'').replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,'$1').replace(/\*\*/g,'').replace(/&#x20;|&nbsp;/gi,' ').replace(/\\&/g,'&');
 const lines=visible.split(/\r?\n/).map(x=>x.trim()).filter(x=>x&&!/^\(?image\b/i.test(x)&&!/^company logo for/i.test(x)&&!/^https?:\/\//i.test(x));
 const find=(re)=>{let m=visible.match(re);return m?.[1]?.trim()||''};
 company=find(/(?:^|\n)(?:company|employer|organization|organisation)\s*:\s*([^\n]+)/im)||company;
 role=find(/(?:^|\n)(?:job title|position|role|job opening|opportunity)\s*:\s*([^\n]+)/im)||role;
 const header=lines[0]||'';
 if(!role&&!company){let m=header.match(/^(.{3,90}?)\s+(?:at|@)\s+(.{2,80})$/i);if(m){role=m[1];company=m[2]}}
 if(!role){const ix=lines.findIndex(l=>l===company);if(ix>=0&&lines[ix+1])role=lines[ix+1]}
 if(!role){let h=header.match(/^(.{3,90}?)\s+[-–|]\s+(.{2,60})$/);if(h){role=h[1];company=company||h[2]}}
 if(!role&&/\b(intern|analyst|engineer|manager|developer|assistant|specialist|associate|coordinator|consultant|designer|scientist|administrator)\b/i.test(header))role=header.slice(0,120);
 if(!company){const fromTitle=visible.match(/\b(?:at|with)\s+([A-Z][\w&.,' -]{1,55})/);if(fromTitle&&!/^(the|our|least)\b/i.test(fromTitle[1]))company=fromTitle[1].trim()}
 let url=jobLink?.url||(raw.match(/https?:\/\/[^\s<>'"\])]+/i)||[])[0]||'';
 try{const u=new URL(url.replace(/\\&/g,'&'));const jobId=u.pathname.match(/^\/jobs\/view\/(\d+)/);if(/(^|\.)linkedin\.com$/i.test(u.hostname)&&jobId)url=`https://www.linkedin.com/jobs/view/${jobId[1]}/`;else url=u.origin+u.pathname;}catch{}
 const deadline=find(/(?:apply by|application deadline|deadline|closing date)\s*:?\s*([^\n]{6,55})/i);
 function dateISO(v){if(!v)return '';const iso=v.match(/\b(20\d{2})-(\d{2})-(\d{2})\b/);if(iso)return iso[0];let d=new Date(v.replace(/\b(?:by|on)\b/i,''));return Number.isNaN(d.getTime())?'':`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
 const fields={company,role,url,deadline:dateISO(deadline)};let count=0;
 for(const [k,v] of Object.entries(fields)){const input=form.elements.namedItem(k);if(input&&v){input.value=v;count++}}
 const type=form.elements.namedItem('type');if(type&&/internship|intern\b/i.test(role))type.value='Internship';
 const locationLine=lines.find(l=>/\b[A-Za-z][A-Za-z .-]+,\s*[A-Z]{2}\b/.test(l));
 const notes=form.elements.namedItem('notes');if(notes&&!notes.value){notes.value=[locationLine?`Location / posting info: ${locationLine}`:'',...lines.filter(l=>l!==company&&l!==role&&l!==locationLine).slice(0,7)].filter(Boolean).join('\n').slice(0,1500)}
 const st=document.getElementById('autofill-status');if(st)st.textContent=count?`Filled ${count} field${count===1?'':'s'}. Review the extracted details before saving.`:'Could not confidently identify fields. Include the company and job title in the copied text.';
}
function download(){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=`careertrack-backup-${today()}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
$('app').addEventListener('click',e=>{let p=e.target.closest('[data-page]');if(p){page=p.dataset.page;query='';filter='All';render();return}let q=e.target.closest('[data-quick]');if(q){const [kind,appId]=q.dataset.quick.split(':');const app=appOf(appId);if(app)openForm(kind,null,{applicationId:appId,company:app.company});return}let a=e.target.closest('[data-action]');if(a){switch(a.dataset.action){case'autofill-job':autoFillJob();break;case'signout':signOut();break;case'add-app':openForm('app');break;case'add-interview':openForm('interview');break;case'add-contact':openForm('contact');break;case'add-reminder':openForm('reminder');break;case'close':modal=null;editId=null;render();break;case'export':download();break;case'demo':if(confirm('Replace your cloud records with fictional sample data? Export a backup first if needed.')){db=structuredClone(DEMO);save();page='dashboard';render()}break;case'clear':if(confirm('Permanently delete all CareerTrack records from your cloud account?')){db=fresh();save();page='dashboard';render()}break}return}let edit=e.target.closest('[data-edit]');if(edit){let [kind,k]=edit.dataset.edit.split(':');openForm(kind,k);return}let d=e.target.closest('[data-delete]');if(d){let [kind,k]=d.dataset.delete.split(':');del(kind,k)}});

$('app').addEventListener('change',async e=>{if(e.target.id==='status-filter'){filter=e.target.value;render()}if(e.target.dataset.check){let r=db.reminders.find(x=>x.id===e.target.dataset.check);if(r){r.done=e.target.checked;save();render()}}if(e.target.id==='import-file'&&e.target.files[0]){try{let d=JSON.parse(await e.target.files[0].text());if(!d||!['applications','interviews','contacts','reminders'].every(k=>Array.isArray(d[k])))throw Error('Invalid backup structure');if(confirm('Replace all records in your cloud account with this backup?')){db=d;save();render()}}catch(err){alert('Unable to import backup: '+err.message)}}});
$('app').addEventListener('submit',e=>{if(e.target.id!=='recordform')return;e.preventDefault();let raw=Object.fromEntries(new FormData(e.target).entries()),key={app:'applications',interview:'interviews',contact:'contacts',reminder:'reminders'}[modal],x={...raw,id:editId||id()};if(modal==='reminder')x.done=editId?!!db.reminders.find(z=>z.id===editId)?.done:false;if(editId){let ix=db[key].findIndex(z=>z.id===editId);if(ix>=0)db[key][ix]=x}else db[key].push(x);save();modal=null;editId=null;render()});

 class="field">Password<input name="password" type="password" autocomplete="${authMode==='signup'?'new-password':'current-password'}" required minlength="6" placeholder="At least 6 characters"></label>`:''}<button class="btn primary" type="submit">${authMode==='signup'?'Sign up':authMode==='reset'?'Email reset link':authMode==='update'?'Update password':'Log in'}</button></form><div class="authlinks">${authMode==='login'?`<button data-authmode="signup">Create an account</button><button data-authmode="reset">Forgot password?</button>`:`<button data-authmode="login">Back to log in</button>`}</div><p class="authnote auth-note">Your data stays in your private cloud workspace. Never enter a service-role key in this website.</p></section></div></div>`}
async function flushSync(){if(!cloudReady||!activeUser)return;if(syncBusy){syncPending=true;return}if(!syncPending)return;syncBusy=true;syncPending=false;const snapshot=structuredClone(db);try{const {error}=await client.from('workspaces').upsert({user_id:activeUser.id,data:snapshot,updated_at:new Date().toISOString()},{onConflict:'user_id'});if(error)throw error}catch(e){syncPending=true;console.error('Cloud save failed:',e);showSyncError('Cloud save failed. Check your internet connection and refresh only after saving a backup. '+e.message)}finally{syncBusy=false;if(syncPending)saveTimer=setTimeout(flushSync,1200)}}
function showSyncError(msg){let notice=document.getElementById('sync-error');if(!notice){notice=document.createElement('div');notice.id='sync-error';notice.className='sync-error';document.body.appendChild(notice)}notice.textContent=msg}
async function loadCloud(){cloudReady=false;db=fresh();const {data,error}=await client.from('workspaces').select('data').eq('user_id',activeUser.id).maybeSingle();if(error){authMessage='Could not load your private workspace: '+error.message;activeUser=null;render();return}if(data?.data){let x=data.data;if(['applications','interviews','contacts','reminders'].every(k=>Array.isArray(x[k])))db=x}cloudReady=true;authMessage='';render()}
async function signOut(){clearTimeout(saveTimer);if(syncPending)await flushSync();const {error}=await client.auth.signOut();if(error){alert(error.message);return}activeUser=null;cloudReady=false;db=fresh();authMode='login';render()}
async function start(){if(!settings.supabaseUrl||!settings.supabaseAnonKey){$('app').innerHTML='<div class="authwrap"><div class="authcard"><h1>CareerTrack setup required</h1><p>Please add your Supabase project URL and publishable / anon key in <code>config.js</code>, then deploy this folder. See README.md.</p></div></div>';return}if(!window.supabase?.createClient){$('app').innerHTML='<div class="authwrap"><div class="authcard"><h1>Could not load authentication</h1><p>Check your internet connection and reload the page.</p></div></div>';return}client=window.supabase.createClient(settings.supabaseUrl,settings.supabaseAnonKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});const {data:{session},error}=await client.auth.getSession();if(error)console.error(error);activeUser=session?.user||null;if(activeUser)await loadCloud();else render();client.auth.onAuthStateChange((event,session)=>{if(event==='PASSWORD_RECOVERY'){activeUser=session?.user||null;authMode='update';authMessage='Set your new password.';render();return}if(event==='SIGNED_OUT'){activeUser=null;cloudReady=false;db=fresh();render()}else if(event==='SIGNED_IN'&&session?.user?.id!==activeUser?.id){activeUser=session.user;setTimeout(()=>loadCloud(),0)}})}
$('app').addEventListener('click',e=>{let x=e.target.closest('[data-authmode]');if(x){authMode=x.dataset.authmode;authMessage='';render()}});
$('app').addEventListener('submit',async e=>{if(e.target.id!=='authform')return;e.preventDefault();let form=e.target;let btn=form.querySelector('button[type=submit]');btn.disabled=true;let fd=new FormData(form),email=String(fd.get('email')).trim(),password=String(fd.get('password')||'');try{let r;if(authMode==='update'){r=await client.auth.updateUser({password});if(!r.error){authMode='login';authMessage='Password updated. Please log in.';await client.auth.signOut();activeUser=null}}else if(authMode==='signup'){r=await client.auth.signUp({email,password,options:{emailRedirectTo:location.origin+location.pathname}});authMessage=r.data?.session?'Account created. Loading workspace…':'Check your email for the confirmation link, then return to log in.'}else if(authMode==='reset'){r=await client.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});authMessage='If that email is registered, a password reset link has been sent.'}else{r=await client.auth.signInWithPassword({email,password});authMessage='Logging in…'}if(r.error)throw r.error;if(authMode==='update'){render()}else if(r.data?.user&&r.data?.session){activeUser=r.data.user;await loadCloud()}else render()}catch(err){authMessage=err.message||'Authentication failed';render()}});
start();
</script></body></html>
